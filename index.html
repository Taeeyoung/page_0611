<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Hub — AI 서비스 모음</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0c0c12;
      --surf1:     #14141e;
      --surf2:     #1c1c2a;
      --surf3:     #242434;
      --border:    #28283c;
      --accent:    #7c6ffc;
      --accent2:   #22d3ee;
      --green:     #34d399;
      --pink:      #f472b6;
      --amber:     #fbbf24;
      --text:      #dde1f0;
      --muted:     #7a7a9a;
      --sidebar-w: 210px;
      --header-h:  58px;
      --radius:    12px;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', 'Apple SD Gothic Neo', system-ui, sans-serif;
      min-height: 100vh;
    }

    /* ── HEADER ─────────────────────────────── */
    header {
      position: fixed; top: 0; left: 0; right: 0;
      height: var(--header-h);
      background: rgba(20, 20, 30, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center;
      padding: 0 20px; gap: 10px; z-index: 200;
    }

    .logo {
      font-size: 1.15rem; font-weight: 800; letter-spacing: -0.02em;
      background: linear-gradient(130deg, var(--accent), var(--accent2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      white-space: nowrap; margin-right: 12px; flex-shrink: 0;
    }

    .top-nav {
      display: flex; gap: 4px; overflow-x: auto;
      scrollbar-width: none;
    }
    .top-nav::-webkit-scrollbar { display: none; }

    .top-nav button {
      background: none; border: 1.5px solid transparent;
      color: var(--muted); padding: 5px 15px;
      border-radius: 20px; cursor: pointer;
      font-size: 0.83rem; white-space: nowrap;
      transition: color .18s, border-color .18s, background .18s;
      font-family: inherit;
    }
    .top-nav button:hover { color: var(--text); background: var(--surf3); }
    .top-nav button.active {
      color: var(--accent); border-color: var(--accent);
      background: rgba(124, 111, 252, 0.12);
    }

    /* ── LAYOUT ─────────────────────────────── */
    .layout {
      display: flex;
      padding-top: var(--header-h);
      min-height: 100vh;
    }

    /* ── SIDEBAR ─────────────────────────────── */
    aside {
      width: var(--sidebar-w); flex-shrink: 0;
      position: fixed; top: var(--header-h); bottom: 0; left: 0;
      background: var(--surf1);
      border-right: 1px solid var(--border);
      overflow-y: auto; padding: 16px 10px 40px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .sidebar-label {
      font-size: 0.68rem; font-weight: 700;
      color: var(--muted); text-transform: uppercase;
      letter-spacing: .1em; padding: 10px 8px 6px;
    }

    .sidebar-btn {
      display: flex; align-items: center; gap: 8px;
      width: 100%; text-align: left; background: none; border: none;
      color: var(--muted); padding: 8px 10px; border-radius: 8px;
      cursor: pointer; font-size: 0.845rem; font-family: inherit;
      transition: color .18s, background .18s;
    }
    .sidebar-btn:hover { color: var(--text); background: var(--surf3); }
    .sidebar-btn.active {
      color: var(--accent2);
      background: rgba(34, 211, 238, 0.09);
      font-weight: 600;
    }
    .sidebar-btn .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: currentColor; flex-shrink: 0;
    }

    /* ── MAIN ─────────────────────────────── */
    main {
      margin-left: var(--sidebar-w); flex: 1;
      padding: 32px 28px 80px;
      max-width: 1200px;
    }

    .page-header {
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }
    .page-header h2 {
      font-size: 1.5rem; font-weight: 700; margin-bottom: 6px;
    }
    .page-header p { color: var(--muted); font-size: 0.875rem; }

    /* sub section */
    .subsection {
      display: none;
      animation: fadeUp .22s ease;
    }
    .subsection.visible { display: block; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .sub-title {
      font-size: 0.78rem; font-weight: 700;
      color: var(--muted); text-transform: uppercase;
      letter-spacing: .08em; margin-bottom: 14px;
    }

    /* ── CARDS ─────────────────────────────── */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 14px;
    }

    .card {
      background: var(--surf1);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 16px 16px;
      text-decoration: none; color: inherit;
      display: flex; flex-direction: column; gap: 9px;
      position: relative; overflow: hidden;
      transition: transform .2s, border-color .2s, box-shadow .2s;
    }
    .card::after {
      content: '';
      position: absolute; inset: 0;
      border-radius: var(--radius);
      background: linear-gradient(135deg, rgba(124,111,252,.06), rgba(34,211,238,.04));
      opacity: 0; transition: opacity .2s;
    }
    .card:hover {
      transform: translateY(-4px);
      border-color: rgba(124,111,252,.55);
      box-shadow: 0 10px 40px rgba(124,111,252,.18);
    }
    .card:hover::after { opacity: 1; }

    .card-top {
      display: flex; align-items: center; justify-content: space-between;
    }

    .card-icon {
      width: 40px; height: 40px;
      background: var(--surf2);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.35rem; flex-shrink: 0;
    }

    .card-arrow {
      color: var(--muted); font-size: 0.75rem;
      transition: color .2s, transform .2s;
    }
    .card:hover .card-arrow { color: var(--accent); transform: translate(2px,-2px); }

    .card-name {
      font-size: 0.95rem; font-weight: 700; line-height: 1.2;
    }

    .card-desc {
      font-size: 0.775rem; color: var(--muted);
      line-height: 1.55; flex: 1;
    }

    .card-tag {
      display: inline-block; font-size: 0.68rem;
      padding: 2px 9px; border-radius: 20px; align-self: flex-start;
      background: rgba(124,111,252,.13);
      color: var(--accent); border: 1px solid rgba(124,111,252,.28);
      font-weight: 600; letter-spacing: .02em;
    }
    .card-tag.green  { background: rgba(52,211,153,.1);  color: var(--green);  border-color: rgba(52,211,153,.3); }
    .card-tag.cyan   { background: rgba(34,211,238,.1);  color: var(--accent2); border-color: rgba(34,211,238,.3); }
    .card-tag.pink   { background: rgba(244,114,182,.1); color: var(--pink);   border-color: rgba(244,114,182,.3); }
    .card-tag.amber  { background: rgba(251,191,36,.1);  color: var(--amber);  border-color: rgba(251,191,36,.3); }

    .my-service-btn {
      background: rgba(124,111,252,.15);
      color: var(--accent);
      border: 1px solid rgba(124,111,252,.35);
      border-radius: 8px;
      font-size: 0.75rem;
      padding: 5px 12px;
      width: 100%;
      cursor: pointer;
      font-family: inherit;
      font-weight: 600;
      transition: background .18s;
      position: relative; z-index: 1;
      margin-top: 2px;
    }
    .my-service-btn:hover { background: rgba(124,111,252,.3); }

    /* scrollbar */
    aside::-webkit-scrollbar { width: 4px; }
    aside::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* responsive */
    @media (max-width: 700px) {
      .layout { flex-direction: column; }
      aside { display: none; }
      main { margin-left: 0; padding: 20px 14px 60px; }
      .card-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
    }
  </style>
</head>

/* ── STATE ──────────────────────────────────────────────────────── */
let activeCat = 'chatbot';
let activeSub = null;

/* ── RENDER ─────────────────────────────────────────────────────── */
function renderAll() {
  const cat = DATA[activeCat];
  if (!activeSub || !cat.subs[activeSub]) {
    activeSub = Object.keys(cat.subs)[0];
  }
  renderTopNav();
  renderSidebar(cat);
  renderMain(cat);
}

function renderTopNav() {
  const nav = document.getElementById('topNav');
  nav.innerHTML = '';
  Object.entries(DATA).forEach(([key, cat]) => {
    const btn = document.createElement('button');
    btn.textContent = cat.label;
    if (key === activeCat) btn.classList.add('active');
    btn.onclick = () => { activeCat = key; activeSub = null; renderAll(); };
    nav.appendChild(btn);
  });
}

function renderSidebar(cat) {
  const aside = document.getElementById('sidebar');
  aside.innerHTML = `<div class="sidebar-label">소 카테고리</div>`;
  Object.entries(cat.subs).forEach(([key, sub]) => {
    const btn = document.createElement('button');
    btn.className = 'sidebar-btn' + (key === activeSub ? ' active' : '');
    btn.innerHTML = `<span class="dot"></span>${sub.label}`;
    btn.onclick = () => { activeSub = key; renderSidebar(cat); showSub(key); };
    aside.appendChild(btn);
  });
}

function renderMain(cat) {
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="page-header">
      <h2>${cat.label}</h2>
      <p>${cat.desc}</p>
    </div>
  `;
  Object.entries(cat.subs).forEach(([subKey, sub]) => {
    const sec = document.createElement('div');
    sec.className = 'subsection' + (subKey === activeSub ? ' visible' : '');
    sec.id = 'sub-' + subKey;
    sec.innerHTML = `
      <div class="sub-title">${sub.label}</div>
      <div class="card-grid">
        ${sub.cards.map(c => `
          <a class="card" href="${c.url || c.myUrl || '#'}" target="_blank" rel="noopener noreferrer">
            <div class="card-top">
              <div class="card-icon">${c.icon}</div>
              ${c.url ? '<span class="card-arrow">↗</span>' : ''}
            </div>
            <div class="card-name">${c.name}</div>
            <div class="card-desc">${c.desc}</div>
            <span class="card-tag ${c.color}">${c.tag}</span>
            ${c.myUrl ? `<button class="my-service-btn" onclick="event.stopPropagation();event.preventDefault();window.open('${c.myUrl}','_blank')">▶ 내 서비스</button>` : ''}
          </a>
        `).join('')}
      </div>
    `;
    main.appendChild(sec);
  });
}

function showSub(key) {
  document.querySelectorAll('.subsection').forEach(s => {
    s.classList.toggle('visible', s.id === 'sub-' + key);
  });
}

/* ── INIT ───────────────────────────────────────────────────────── */
renderAll();
</script>
